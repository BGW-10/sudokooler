[package]
name = "sudokooler"
version = "0.1.0"
edition = "2024"
description = "Lightweight cross-platform daemon to drive Sudokoo CPU cooler USB HID displays"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hidapi = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
