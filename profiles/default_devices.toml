# Default Sudokoo USB HID Device Registry
#
# Safety rule: Only profiles with `enabled = true` will ever be opened or written to
# by `sudokooler`. Every entry MUST belong to Sudokoo's USB Vendor ID (0x381C).

[[devices]]
name = "Sudokoo SK700V"
vid = 0x381C
pid = 0x0003
protocol = "sk700v"
enabled = true
verified = true
report_id = 0x10
report_length = 64
# Power bar is scaled 0..100 against `power_bar_max_w` (integer floor: power * 100 / max).
# MasterCraft captures on Ryzen 9800X3D (120W TDP * 1.3) match 156 W; 160 W is a safe default.
power_bar_max_w = 160
temp_unit = "C"
init_packets = ["106801090203017816"]
shutdown_packets = ["106801090203007716"]

# ---------------------------------------------------------------------------
# Other 0x381C PIDs discovered in MasterCraft's main bundle (`index.jsc`):
#   PIDs: 0x0001, 0x0002, 0x0004, 0x0005
#   Candidate models: SK700V MACH, SK620V, PROTEUS, ENERGLO
#
# Intentionally omitted until captured and verified on physical hardware (not
# all Sudokoo devices share the SK700V segmented-display packet schema).
# ---------------------------------------------------------------------------
